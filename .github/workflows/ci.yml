name: CI backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Generate Prisma client for TypeScript compilation
        env:
          AUTH_DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=auth
          ACADEMIC_DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=academic
        run: |
          npm run auth:db:generate
          npm run academic:db:generate
      - run: npm run build
      - run: npm run lint
      - run: npm run test

  request-deployment:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Request independent backend deployment
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY || 'jhon-livias/ci-deploy' }}
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DEPLOY_DISPATCH_TOKEN" ]; then
            echo "::warning ::Secret DEPLOY_DISPATCH_TOKEN no está configurado. Omitiendo notificación de despliegue a $DEPLOY_REPOSITORY. Configúralo en Settings > Secrets and variables > Actions para habilitar CD automático."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DEPLOY_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$DEPLOY_REPOSITORY/dispatches" \
            --data '{"event_type":"deploy-production","client_payload":{"component":"all"}}'
